<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login — FashionHub</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet"/>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>

  <style>
    :root {
      --primary:    #1a1a2e;
      --accent:     #e94560;
      --surface:    #16213e;
      --card-bg:    #0f3460;
      --text-light: #f0f0f0;
      --muted:      #a0aec0;
    }

    * { box-sizing: border-box; }

    body {
      background: var(--primary);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-light);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── Login Wrapper ── */
    .login-wrapper {
      width: 100%;
      max-width: 440px;
      padding: 1rem;
    }

    /* ── Brand Header ── */
    .brand-header {
      text-align: center;
      margin-bottom: 2rem;
    }
    .brand-header .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .brand-header .brand-name span { color: var(--accent); }
    .brand-header p {
      color: var(--muted);
      font-size: 0.9rem;
      margin-top: 0.25rem;
    }

    /* ── Card ── */
    .login-card {
      background: var(--surface);
      border: 1px solid rgba(233, 69, 96, 0.2);
      border-radius: 16px;
      padding: 2.5rem 2rem;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.45s ease both;
    }

    .card-section-title {
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--accent);
      border-bottom: 1px solid rgba(233, 69, 96, 0.2);
      padding-bottom: 0.7rem;
      margin-bottom: 1.5rem;
    }

    /* ── Form Controls ── */
    .form-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .form-control {
      background: var(--card-bg) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: var(--text-light) !important;
      border-radius: 9px;
      padding: 0.65rem 1rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .form-control:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.18) !important;
    }
    .form-control::placeholder { color: var(--muted); }

    /* ── Input Group Icon ── */
    .input-group-text {
      background: var(--card-bg);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--muted);
      border-right: none;
      border-radius: 9px 0 0 9px;
    }
    .input-group .form-control {
      border-left: none !important;
      border-radius: 0 9px 9px 0;
    }

    /* ── Login Button ── */
    .btn-login {
      background: var(--accent);
      border: none;
      color: white;
      font-weight: 600;
      border-radius: 9px;
      padding: 0.65rem;
      font-size: 0.95rem;
      letter-spacing: 0.3px;
      width: 100%;
      transition: background 0.2s, transform 0.15s;
    }
    .btn-login:hover {
      background: #c73652;
      color: white;
      transform: translateY(-1px);
    }

    /* ── Alerts ── */
    .alert-error-custom {
      background: rgba(233, 69, 96, 0.12);
      border: 1px solid rgba(233, 69, 96, 0.3);
      color: #fca5a5;
      border-radius: 10px;
      font-size: 0.88rem;
    }
    .alert-success-custom {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      border-radius: 10px;
      font-size: 0.88rem;
    }

    /* ── Footer Note ── */
    .login-footer {
      text-align: center;
      margin-top: 1.5rem;
      color: var(--muted);
      font-size: 0.8rem;
    }

    /* ── Fade-in ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

<body>

  <div class="login-wrapper">

    <!-- ── Brand ── -->
    <div class="brand-header">
      <div class="brand-name"><span>Fashion</span>Hub</div>
      <p><i class="bi bi-shield-lock me-1"></i>Admin Portal</p>
    </div>

    <!-- ── Login Card ── -->
    <div class="login-card">

      <div class="card-section-title">
        <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
      </div>

      <!-- Error Alert -->
      <div th:if="${param.error}"
           class="alert alert-error-custom d-flex align-items-center mb-3">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span>Invalid username or password. Please try again.</span>
      </div>

      <!-- Logout Success Alert -->
      <div th:if="${param.logout}"
           class="alert alert-success-custom d-flex align-items-center mb-3">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span>You have been logged out successfully.</span>
      </div>

      <!--
        action="/login"   → Spring Security handles POST /login automatically
        method="post"     → required for Spring Security form login
      -->
      <form th:action="@{/login}" method="post">

        <!-- Username -->
        <div class="mb-3">
          <label for="username" class="form-label">Username</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-person"></i>
            </span>
            <input type="text"
                   id="username"
                   name="username"
                   class="form-control"
                   placeholder="Enter username"
                   autocomplete="username"
                   required/>
          </div>
        </div>

        <!-- Password -->
        <div class="mb-4">
          <label for="password" class="form-label">Password</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="bi bi-lock"></i>
            </span>
            <input type="password"
                   id="password"
                   name="password"
                   class="form-control"
                   placeholder="Enter password"
                   autocomplete="current-password"
                   required/>
          </div>
        </div>

        <!-- CSRF Token (Thymeleaf + Spring Security auto-injects this) -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <button type="submit" class="btn btn-login">
          <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
        </button>

      </form>
    </div>

    <div class="login-footer">
      &copy; 2026 FashionHub &mdash; All rights reserved
    </div>

  </div>

  <!-- Bootstrap 5 JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
