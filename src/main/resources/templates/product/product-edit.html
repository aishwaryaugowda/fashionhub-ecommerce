<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Edit Product — FashionHub</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />
  <!-- Re-use the same <style> block from product-list.html -->
</head>

<body>

  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <div class="page-header">
    <div class="container">
      <h1><span>Edit</span> Product</h1>
      <p class="mb-0">
        <a th:href="@{/}" style="color:var(--muted);text-decoration:none;">Home</a>
        <span class="mx-2" style="color:var(--muted);">/</span>
        <a th:href="@{/products}" style="color:var(--muted);text-decoration:none;">Products</a>
        <span class="mx-2" style="color:var(--muted);">/</span>
        <span style="color:var(--accent);">Edit</span>
      </p>
    </div>
  </div>

  <div class="container py-4">
    <div class="row justify-content-center">
      <div class="col-lg-6">
        <div class="fh-card p-4 fade-in">

          <div class="card-title-accent">
            <i class="bi bi-pencil-square me-2"></i>
            Edit: <span th:text="${product.name}"></span>
          </div>

          <!-- Image Preview -->
          <img th:src="${product.imageUrl != null and !product.imageUrl.isEmpty() ? product.imageUrl : defaultImageUrl}"
            class="img-preview" alt="preview" />

          <form th:action="@{/products/update}" th:object="${product}" method="post">

            <!-- Hidden ID -->
            <input type="hidden" th:field="*{id}" />

            <div class="mb-3">
              <label class="form-label">Product Name *</label>
              <input type="text" th:field="*{name}" class="form-control form-control-sm"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
              <label class="form-label">Description</label>
              <textarea th:field="*{description}" class="form-control form-control-sm"
                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="2"></textarea>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
              </div>
            </div>

            <div class="row g-2 mb-3">
              <div class="col-6">
                <label class="form-label">Price *</label>
                <input type="number" th:field="*{price}" class="form-control form-control-sm"
                  th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" step="0.01" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
              </div>
              <div class="col-6">
                <label class="form-label">Stock *</label>
                <input type="number" th:field="*{stockQuantity}" class="form-control form-control-sm"
                  th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}"
                  th:errors="*{stockQuantity}"></div>
              </div>
            </div>

            <!-- Category Dropdown -->
            <div class="mb-4">
              <label class="form-label">Category *</label>

              <select name="categoryId" class="form-select" required>

                <option value="">— Select Category —</option>

                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                  th:selected="${cat.id == product.category.id}">
                </option>

              </select>
            </div>
            <div class="d-flex gap-2">
              <button type="submit" class="btn btn-accent flex-grow-1">
                <i class="bi bi-check-lg me-2"></i>Update Product
              </button>
              <a th:href="@{/products}" class="btn btn-outline-secondary">
                Cancel
              </a>
            </div>

          </form>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
