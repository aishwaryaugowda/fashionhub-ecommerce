<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Products — FashionHub</title>

  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet" />
  <!-- Google Fonts -->
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=DM+Sans:wght@300;400;500&display=swap"
    rel="stylesheet" />

  <style>
    :root {
      --primary: #1a1a2e;
      --accent: #e94560;
      --surface: #16213e;
      --card-bg: #0f3460;
      --text-light: #f0f0f0;
      --muted: #a0aec0;
    }

    body {
      background: var(--primary);
      font-family: 'DM Sans', sans-serif;
      color: var(--text-light);
      min-height: 100vh;
    }

    /* ── Page Header ── */
    .page-header {
      background: linear-gradient(135deg, var(--surface), var(--card-bg));
      border-bottom: 3px solid var(--accent);
      padding: 2.5rem 0 2rem;
    }

    .page-header h1 {
      font-family: 'Playfair Display', serif;
      font-size: 2.4rem;
    }

    .page-header h1 span {
      color: var(--accent);
    }

    .page-header p {
      color: var(--muted);
      font-size: 0.95rem;
    }

    /* ── Cards ── */
    .fh-card {
      background: var(--surface);
      border: 1px solid rgba(233, 69, 96, 0.15);
      border-radius: 14px;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
    }

    .card-title-accent {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--accent);
      border-bottom: 1px solid rgba(233, 69, 96, 0.2);
      padding-bottom: 0.75rem;
      margin-bottom: 1.25rem;
    }

    /* ── Form Controls ── */
    .form-control,
    .form-select {
      background: var(--card-bg) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: var(--text-light) !important;
      border-radius: 8px;
    }

    .form-control:focus,
    .form-select:focus {
      border-color: var(--accent) !important;
      box-shadow: 0 0 0 3px rgba(233, 69, 96, 0.18) !important;
    }

    .form-control::placeholder {
      color: var(--muted);
    }

    .form-select option {
      background: var(--card-bg);
      color: var(--text-light);
    }

    .form-label {
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    /* ── Buttons ── */
    .btn-accent {
      background: var(--accent);
      border: none;
      color: white;
      font-weight: 500;
      border-radius: 8px;
      padding: 0.55rem 1.4rem;
      transition: background 0.2s, transform 0.15s;
    }

    .btn-accent:hover {
      background: #c73652;
      color: white;
      transform: translateY(-1px);
    }

    .btn-edit-sm {
      background: transparent;
      border: 1px solid rgba(160, 174, 192, 0.35);
      color: var(--muted);
      border-radius: 6px;
      padding: 0.25rem 0.65rem;
      font-size: 0.78rem;
      transition: all 0.2s;
    }

    .btn-edit-sm:hover {
      background: rgba(160, 174, 192, 0.12);
      color: var(--text-light);
    }

    .btn-delete-sm {
      background: transparent;
      border: 1px solid rgba(233, 69, 96, 0.35);
      color: var(--accent);
      border-radius: 6px;
      padding: 0.25rem 0.65rem;
      font-size: 0.78rem;
      transition: all 0.2s;
    }

    .btn-delete-sm:hover {
      background: var(--accent);
      color: white;
    }

    /* ── Table ── */
    .fh-table {
      color: var(--text-light);
      border-collapse: separate;
      border-spacing: 0 5px;
    }

    .fh-table thead th {
      background: var(--card-bg);
      color: var(--muted);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.9px;
      font-weight: 500;
      border: none;
      padding: 0.8rem 0.9rem;
    }

    .fh-table thead th:first-child {
      border-radius: 8px 0 0 8px;
    }

    .fh-table thead th:last-child {
      border-radius: 0 8px 8px 0;
    }

    .fh-table tbody tr {
      background: var(--card-bg);
      transition: background 0.2s;
    }

    .fh-table tbody tr:hover {
      background: #153a6b;
    }

    .fh-table tbody td {
      border: none;
      padding: 0.8rem 0.9rem;
      vertical-align: middle;
      font-size: 0.88rem;
    }

    .fh-table tbody td:first-child {
      border-radius: 8px 0 0 8px;
    }

    .fh-table tbody td:last-child {
      border-radius: 0 8px 8px 0;
    }

    /* ── Badges ── */
    .id-badge {
      background: rgba(233, 69, 96, 0.15);
      color: var(--accent);
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    .cat-badge {
      background: rgba(99, 179, 237, 0.15);
      color: #90cdf4;
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.78rem;
    }

    .stock-ok {
      background: rgba(34, 197, 94, 0.15);
      color: #86efac;
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.78rem;
    }

    .stock-low {
      background: rgba(233, 69, 96, 0.15);
      color: #fca5a5;
      border-radius: 5px;
      padding: 2px 9px;
      font-size: 0.78rem;
    }

    .count-pill {
      background: var(--accent);
      color: white;
      border-radius: 20px;
      padding: 2px 12px;
      font-size: 0.78rem;
      font-weight: 600;
    }

    /* ── Image Thumbnail ── */
    .img-thumb {
      width: 64px;
      height: 64px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid rgba(233, 69, 96, 0.25);
      background: var(--primary);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s;
    }

    .img-thumb:hover {
      transform: scale(1.08);
    }

    .img-placeholder {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      background: var(--primary);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 1.4rem;
    }

    /* ── Utilities ── */
    .fw-500 {
      font-weight: 500;
    }

    .text-accent {
      color: var(--accent);
    }

    .mb-compact {
      margin-bottom: 0.85rem;
    }

    /* ── Alerts ── */
    .alert-success-custom {
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #86efac;
      border-radius: 10px;
    }

    .alert-error-custom {
      background: rgba(233, 69, 96, 0.12);
      border: 1px solid rgba(233, 69, 96, 0.3);
      color: #fca5a5;
      border-radius: 10px;
    }

    /* ── Empty State ── */
    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: var(--muted);
    }

    .empty-state i {
      font-size: 3rem;
      opacity: 0.35;
      display: block;
      margin-bottom: 1rem;
    }

    /* ── Fade-in ── */
    .fade-in {
      animation: fadeUp 0.45s ease both;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- ── Navbar ── -->
  <nav th:replace="~{fragments/navbar :: navbar}"></nav>

  <!-- ── Page Header ── -->
  <div class="page-header">
    <div class="container">
      <h1><span>Product</span> Management</h1>
      <p class="mb-0">
        <a th:href="@{/}" style="color:var(--muted);text-decoration:none;">
          <i class="bi bi-house-door me-1"></i>Home
        </a>
        <span class="mx-2" style="color:var(--muted);">/</span>
        <span style="color:var(--accent);">Products</span>
      </p>
    </div>
  </div>

  <!-- ── Main Content ── -->
  <div class="container py-4">

    <!-- Flash Messages -->
    <div th:if="${successMessage}" class="alert alert-success-custom alert-dismissible fade show fade-in mb-4">
      <i class="bi bi-check-circle-fill me-2"></i>
      <span th:text="${successMessage}"></span>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <div th:if="${errorMessage}" class="alert alert-error-custom alert-dismissible fade show fade-in mb-4">
      <i class="bi bi-exclamation-triangle-fill me-2"></i>
      <span th:text="${errorMessage}"></span>
      <button type="button" class="btn-close btn-close-white" data-bs-dismiss="alert"></button>
    </div>

    <div class="row g-4">

      <!-- ── FILTER PANEL (full-width, above add-form + table) ── -->
      <div class="col-12">
        <div class="fh-card p-4 fade-in" style="animation-delay:0s;">

          <div class="d-flex justify-content-between align-items-center card-title-accent">
            <span><i class="bi bi-funnel me-2"></i>Search &amp; Filter Products</span>
            <!-- Active-filter badge -->
            <span th:if="${hasFilter}" class="count-pill">Filtered</span>
          </div>

          <!--
            GET form — submits filter params as query strings to /products
            All fields are optional; blank fields are simply ignored by the controller.
          -->
          <form th:action="@{/products}" method="get" class="row g-3 align-items-end">

            <!-- Keyword search -->
            <div class="col-lg-4 col-md-6">
              <label class="form-label"><i class="bi bi-search me-1"></i>Search by Name</label>
              <input type="text" name="keyword" class="form-control" placeholder="e.g. Cotton T-Shirt..."
                th:value="${keyword}" />
            </div>

            <!-- Category filter -->
            <div class="col-lg-3 col-md-6">
              <label class="form-label"><i class="bi bi-tags me-1"></i>Category</label>
              <select name="categoryId" class="form-select">
                <option value="">— All Categories —</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"
                  th:selected="${cat.id == categoryId}">
                </option>
              </select>
            </div>

            <!-- Min price -->
            <div class="col-lg-2 col-md-4">
              <label class="form-label"><i class="bi bi-currency-rupee me-1"></i>Min Price</label>
              <input type="number" name="minPrice" class="form-control" placeholder="e.g. 0" min="0" step="0.01"
                th:value="${minPrice}" />
            </div>

            <!-- Max price -->
            <div class="col-lg-2 col-md-4">
              <label class="form-label"><i class="bi bi-currency-rupee me-1"></i>Max Price</label>
              <input type="number" name="maxPrice" class="form-control" placeholder="e.g. 9999" min="0" step="0.01"
                th:value="${maxPrice}" />
            </div>

            <!-- Buttons -->
            <div class="col-lg-1 col-md-4 d-flex gap-2">
              <button type="submit" class="btn btn-accent w-100">
                <i class="bi bi-search"></i>
              </button>
              <!-- Clear button — only visible when a filter is active -->
              <a th:if="${hasFilter}" th:href="@{/products}" class="btn w-100" title="Clear all filters" style="background:transparent;
                        border:1px solid rgba(160,174,192,0.35);
                        color:var(--muted);
                        border-radius:8px;
                        padding:0.55rem 0.6rem;
                        text-align:center;
                        transition:all 0.2s;"
                onmouseover="this.style.borderColor='var(--accent)';this.style.color='var(--text-light)';"
                onmouseout="this.style.borderColor='rgba(160,174,192,0.35)';this.style.color='var(--muted)';">
                <i class="bi bi-x-lg"></i>
              </a>
            </div>

          </form>
        </div>
      </div>

      <!-- ── LEFT: Add Product Form ── -->

      <div class="col-lg-4">
        <div class="fh-card p-4 fade-in">
          <div class="card-title-accent">
            <i class="bi bi-plus-circle me-2"></i>Add New Product
          </div>

          <!--
            th:action   → POST to /products/save
            th:object   → binds this form to the empty Product object from controller
          -->
          <form th:action="@{/products/save}" th:object="${product}" method="post">
            <div class="mb-compact">
              <label class="form-label">Product Name *</label>
              <input type="text" th:field="*{name}" class="form-control form-control-sm"
                th:classappend="${#fields.hasErrors('name')} ? 'is-invalid' : ''" placeholder="Enter product name" />
              <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-compact">
              <label class="form-label">Description</label>
              <textarea th:field="*{description}" class="form-control form-control-sm"
                th:classappend="${#fields.hasErrors('description')} ? 'is-invalid' : ''" rows="2"
                placeholder="Short description..."></textarea>
              <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}" th:errors="*{description}">
              </div>
            </div>

            <div class="row g-2 mb-compact">
              <div class="col-6">
                <label class="form-label">Price *</label>
                <input type="number" th:field="*{price}" class="form-control form-control-sm"
                  th:classappend="${#fields.hasErrors('price')} ? 'is-invalid' : ''" step="0.01" placeholder="0.00" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
              </div>
              <div class="col-6">
                <label class="form-label">Stock *</label>
                <input type="number" th:field="*{stockQuantity}" class="form-control form-control-sm"
                  th:classappend="${#fields.hasErrors('stockQuantity')} ? 'is-invalid' : ''" placeholder="0" />
                <div class="invalid-feedback" th:if="${#fields.hasErrors('stockQuantity')}"
                  th:errors="*{stockQuantity}"></div>
              </div>
            </div>

            <!-- Category Dropdown -->
            <div class="mb-4">
              <label class="form-label">Category *</label>
              <select name="categoryId" class="form-select form-select-sm" required>
                <option value="">— Select Category —</option>
                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                </option>
              </select>
            </div>

            <button type="submit" class="btn btn-accent w-100 py-2">
              <i class="bi bi-plus-lg me-2"></i>Add Product
            </button>
          </form>
        </div>
      </div>

      <!-- ── RIGHT: Product Table ── -->
      <div class="col-lg-8">
        <div class="fh-card p-4 fade-in" style="animation-delay:0.1s;">

          <div class="d-flex justify-content-between align-items-center card-title-accent">
            <span><i class="bi bi-box-seam me-2"></i>All Products</span>
            <span class="count-pill" th:text="${products.size()} + ' total'"></span>
          </div>

          <!-- Products Table -->
          <div th:if="${not #lists.isEmpty(products)}">
            <div class="table-responsive">
              <table class="table fh-table">
                <thead>
                  <tr>
                    <th>#</th>
                    <th>Image</th>
                    <th>Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Stock</th>
                    <th class="text-center">Actions</th>
                  </tr>
                </thead>
                <tbody>
                  <!--
                    th:each="prod : ${products}"
                    Loops over every Product object in the products list.
                    Each iteration exposes the variable 'prod'.
                  -->
                  <tr th:each="prod : ${products}">

                    <!-- ID -->
                    <td><span class="id-badge" th:text="${prod.id}"></span></td>

                    <!-- Image Thumbnail — fallback to default image if error or missing -->
                    <td>
                      <img th:if="${prod.imageUrl != null and !prod.imageUrl.isEmpty()}" th:src="${prod.imageUrl}"
                        class="img-thumb" alt="product" th:attr="onerror='this.src=\'' + ${defaultImageUrl} + '\''" />

                      <img th:if="${prod.imageUrl == null or prod.imageUrl.isEmpty()}" th:src="${defaultImageUrl}"
                        class="img-thumb" alt="default" />
                    </td>

                    <!-- Name -->
                    <td th:text="${prod.name}" style="font-weight:500;"></td>

                    <!-- Category — accesses the related Category object's name -->
                    <td>
                      <span class="cat-badge" th:text="${prod.category.name}">
                      </span>
                    </td>

                    <!-- Price — formatted with ₹ symbol -->
                    <td th:text="'₹' + ${#numbers.formatDecimal(prod.price, 1, 2)}"></td>

                    <!-- Stock — green badge if > 5, red if <= 5 -->
                    <td>
                      <span th:if="${prod.stockQuantity > 5}" class="stock-ok"
                        th:text="${prod.stockQuantity} + ' in stock'">
                      </span>
                      <span th:if="${prod.stockQuantity <= 5}" class="stock-low"
                        th:text="${prod.stockQuantity} + ' low stock'">
                      </span>
                    </td>

                    <!-- Actions -->
                    <td class="text-center">

                      <!-- Edit feature coming soon -->
                      <a th:href="@{/products/edit/{id}(id=${prod.id})}" class="btn btn-edit-sm me-1">
                        <i class="bi bi-pencil me-1"></i>Edit
                      </a>

                      <!-- Delete Button -->
                      <a th:href="@{/products/delete/{id}(id=${prod.id})}" class="btn btn-delete-sm"
                        th:onclick="return confirm('Delete this product?')">
                        <i class="bi bi-trash3 me-1"></i>Delete
                      </a>

                    </td>

                  </tr>
                </tbody>
              </table>
            </div>
          </div>

          <!-- Empty State -->
          <div th:if="${#lists.isEmpty(products)}" class="empty-state">
            <i class="bi bi-box-seam"></i>
            <p class="mb-1 fw-500">No products yet</p>
            <small>Add your first product using the form on the left.</small>
          </div>

        </div>
      </div>

    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
