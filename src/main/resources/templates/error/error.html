<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">

<head>
    <meta charset="UTF-8">
    <title>Error — FashionHub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=DM+Sans:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --primary: #1a1a2e;
            --accent: #e94560;
            --surface: #16213e;
            --text-light: #f0f0f0;
            --muted: #a0aec0;
        }

        body {
            background: var(--primary);
            color: var(--text-light);
            font-family: 'DM Sans', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .error-card {
            background: var(--surface);
            padding: 3rem;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(233, 69, 96, 0.2);
        }

        .error-icon {
            font-size: 4rem;
            color: var(--accent);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            margin-bottom: 1rem;
        }

        p {
            color: var(--muted);
            margin-bottom: 2rem;
        }

        .btn-fh {
            background: var(--accent);
            color: white;
            border-radius: 10px;
            padding: 0.8rem 2rem;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }

        .btn-fh:hover {
            opacity: 0.9;
            transform: translateY(-2px);
            color: white;
        }
    </style>
</head>

<body>
    <div class="error-card">
        <div class="error-icon">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h1>Oops!</h1>
        <p th:text="${errorMessage != null ? errorMessage : 'Something went wrong on our end.'}"></p>
        <a th:href="@{/dashboard}" class="btn btn-fh">Back to Dashboard</a>
    </div>
</body>

</html>
