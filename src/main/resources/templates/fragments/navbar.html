<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            border-bottom: 2px solid #e94560;">

  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand fw-bold fs-4 text-white" th:href="@{/dashboard}">
      <span style="color:#e94560;">Fashion</span>Hub
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-lg-center gap-lg-1">

        <li class="nav-item">
          <a class="nav-link text-white" th:href="@{/dashboard}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" th:href="@{/products}">
            <i class="bi bi-box-seam me-1"></i>Products
          </a>
        </li>

        <li class="nav-item">
          <a class="nav-link text-white" th:href="@{/categories}">
            <i class="bi bi-tags me-1"></i>Categories
          </a>
        </li>

        <!-- Logout -->
        <li class="nav-item ms-lg-2">
          <form th:action="@{/logout}" method="post" class="d-inline">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
            <button type="submit" class="btn btn-sm" style="background:rgba(233,69,96,0.15);
                           border:1px solid rgba(233,69,96,0.45);
                           color:#e94560;
                           border-radius:7px;
                           padding:0.3rem 0.9rem;
                           font-size:0.85rem;
                           transition:all 0.2s;">
              <i class="bi bi-box-arrow-right me-1"></i>Logout
            </button>
          </form>
        </li>

      </ul>
    </div>
  </div>
</nav>

</html>
