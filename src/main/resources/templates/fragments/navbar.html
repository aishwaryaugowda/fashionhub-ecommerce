<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark sticky-top" 
     style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); 
            border-bottom: 2px solid #e94560;">

  <div class="container">
    <!-- Brand -->
    <a class="navbar-brand fw-bold fs-4 text-white" th:href="@{/}">
      <span style="color:#e94560;">Fashion</span>Hub
    </a>

    <!-- Toggler -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
            data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Links -->
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link text-white" th:href="@{/}">
            <i class="bi bi-house-door me-1"></i>Home
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link active text-white" th:href="@{/categories}">
            <i class="bi bi-tags me-1"></i>Categories
          </a>
        </li>
      </ul>

  </div>

</html>
